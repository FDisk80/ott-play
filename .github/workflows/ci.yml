name: CI

on:
  workflow_call: {}

env:
  NODE_VERSION: "22"

permissions:
  contents: read

jobs:
  native-cli-acceptance:
    uses: ./.github/workflows/native-cli-acceptance.yml

  native-webos:
    uses: ./.github/workflows/webos-native.yml

  linux-playback-compat:
    name: Native playback compatibility (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        platform: [ ubuntu-24.04, ubuntu-24.04-arm ]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the native package build dependencies
        run: |
          bash scripts/ci-tauri-linux-deps.sh
          sudo apt-get install -y build-essential dpkg-dev meson ninja-build pkg-config patch binutils \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Compile and qualify the private playback plugin
        run: |
          python3 scripts/build-linux-playback-compat.py --output build/linux-playback-compat
          python3 scripts/package-linux-playback-compat.py prepare
      - name: Preserve native build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-linux-playback-compat-${{ matrix.platform }}
          path: |
            build/linux-playback-compat/*.json
            build/linux-playback-compat/*.log
            build/linux-playback-compat/*.txt
            build/linux-playback-compat/*.tsv
          if-no-files-found: warn
          retention-days: 14
  remote-integration:
    name: Remote control and diagnostics integration
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-ott-play/ottplay-control-server
          ref: 9b28c08eefca3948c78336e7e16a45e6fc492e31
          path: .control-integration
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-ott-play/ottplay-control-server
          ref: 477d2d4adfeb4ce3fa007a443ea9388d41c85447
          path: .control-current
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-ott-play/ottplay-control-server
          ref: 27d1abc81de025fa93e3ac7dc6fbcc67eb6de130
          path: .control-global
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - name: Build lazy diagnostic assets for real transport smokes
        id: runtime-assets
        run: npm run build
      - name: Build the pinned control server
        id: legacy-server
        if: ${{ !cancelled() && steps.runtime-assets.outcome == 'success' }}
        working-directory: .control-integration
        run: go build -o "$RUNNER_TEMP/ottplay-control-server" ./cmd/ottplay-control-server
      - name: Exercise real HTTPS diagnostics
        if: ${{ !cancelled() && steps.legacy-server.outcome == 'success' }}
        env:
          OTT_OFFLINE_PROFILES: unsupported-controller
          OTT_CONTROL_BINARY: ${{ runner.temp }}/ottplay-control-server
          OTT_DIAGNOSTICS_CLI: ${{ github.workspace }}/.control-integration/cli/diagnostics.py
          OTT_CLI: ${{ github.workspace }}/.control-integration/cli/ott.py
        run: node scripts/smoke-diagnostics.cjs
      - name: Exercise legacy repairs with the current CLI
        if: ${{ !cancelled() && steps.legacy-server.outcome == 'success' }}
        env:
          OTT_OFFLINE_PROFILES: unsupported-controller
          OTT_CONTROL_BINARY: ${{ runner.temp }}/ottplay-control-server
          OTT_DIAGNOSTICS_CLI: ${{ github.workspace }}/.control-integration/cli/diagnostics.py
          # M3U metadata uses the current CLI; keep the old server and its negative capability probes.
          OTT_CLI: ${{ github.workspace }}/.control-current/cli/ott.py
        run: node scripts/smoke-remote-cli.cjs
      - name: Exercise the legacy workbench
        if: ${{ !cancelled() && steps.legacy-server.outcome == 'success' }}
        env:
          OTT_OFFLINE_PROFILES: unsupported-controller
          OTT_CONTROL_BINARY: ${{ runner.temp }}/ottplay-control-server
          OTT_DIAGNOSTICS_CLI: ${{ github.workspace }}/.control-integration/cli/diagnostics.py
          OTT_CLI: ${{ github.workspace }}/.control-integration/cli/ott.py
        run: node scripts/smoke-workbench.cjs
      - name: Build the engine-aware control server
        id: current-server
        if: ${{ !cancelled() && steps.runtime-assets.outcome == 'success' }}
        working-directory: .control-current
        run: go build -o "$RUNNER_TEMP/ottplay-control-server-current" ./cmd/ottplay-control-server
      - name: Exercise local profiles with the current controller
        if: ${{ !cancelled() && steps.current-server.outcome == 'success' }}
        env:
          OTT_CONTROL_BINARY: ${{ runner.temp }}/ottplay-control-server-current
          OTT_CLI: ${{ github.workspace }}/.control-current/cli/ott.py
        run: node scripts/smoke-remote-cli.cjs --offline-profiles-only
      - name: Keep the legacy CLI compatible with the current server
        if: ${{ !cancelled() && steps.current-server.outcome == 'success' }}
        env:
          OTT_CONTROL_BINARY: ${{ runner.temp }}/ottplay-control-server-current
          OTT_CLI: ${{ github.workspace }}/.control-integration/cli/ott.py
        run: node scripts/smoke-workbench.cjs
      - name: Reject engine inspection on the legacy server without downgrading
        if: ${{ !cancelled() && steps.legacy-server.outcome == 'success' }}
        env:
          OTT_CONTROL_BINARY: ${{ runner.temp }}/ottplay-control-server
          OTT_CLI: ${{ github.workspace }}/.control-current/cli/ott.py
          OTT_DEBUG_ENGINE_V2: unsupported-controller
          OTT_PERF_CAPTURE: unsupported-controller
        run: node scripts/smoke-workbench.cjs
      - name: Exercise explicit engine inspection and default legacy payloads
        if: ${{ !cancelled() && steps.current-server.outcome == 'success' }}
        env:
          OTT_CONTROL_BINARY: ${{ runner.temp }}/ottplay-control-server-current
          OTT_CLI: ${{ github.workspace }}/.control-current/cli/ott.py
          OTT_DEBUG_ENGINE_V2: "1"
          OTT_PERF_CAPTURE: "1"
        run: node scripts/smoke-workbench.cjs
      - name: Exercise roadmap with the current controller
        if: ${{ !cancelled() && steps.runtime-assets.outcome == 'success' }}
        # This pinned script builds its own controller and compares exact M3U settings.
        run: node .control-current/scripts/smoke_foss_roadmap.cjs .
      - name: Build the pinned global Favorites control server
        id: global-server
        if: ${{ !cancelled() && steps.runtime-assets.outcome == 'success' }}
        working-directory: .control-global
        run: go build -o "$RUNNER_TEMP/ottplay-control-server-global" ./cmd/ottplay-control-server
      - name: Exercise global Favorites through real CLI and HTTP transport
        if: ${{ !cancelled() && steps.global-server.outcome == 'success' }}
        env:
          OTT_CONTROL_BINARY: ${{ runner.temp }}/ottplay-control-server-global
          OTT_CLI: ${{ github.workspace }}/.control-global/cli/ott.py
          OTT_GLOBAL_CONTROL_REVISION: 27d1abc81de025fa93e3ac7dc6fbcc67eb6de130
        run: node scripts/smoke-remote-cli.cjs --global-favorites-only

  typecheck:
    name: Typecheck
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: TypeScript check
        run: npm run typecheck

    timeout-minutes: 30
  lint:
    name: Lint
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Check declared test inventory
        run: npm run check:test-inventory

      - name: Biome lint
        run: npm run lint

    timeout-minutes: 30
  build:
    name: Build
    outputs:
      browser-artifact-id: ${{ steps.browser-artifact.outputs.artifact-id }}
    runs-on: ubuntu-26.04
    needs: [ typecheck, lint ]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Make the event's immutable checkout explicit; do not follow a PR ref.
          ref: ${{ github.sha }}

      - name: Capture original mixed Favorites provenance
        timeout-minutes: 1
        run: >-
          python3 scripts/verify-global-favorites-browser.py
          --capture-provenance build/global-favorites-browser-ci/provenance.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # This frontend job also runs Linux WebKit MSE playback checks.
      - name: Verify Linux WebKit host
        run: node scripts/check-linux-webkit-host.cjs

      - run: npm ci --ignore-scripts

      - name: Verify committed media runtime
        run: npm run check:media

      - name: Build bundle
        run: npm run build

      - name: Check representative release envelope size
        timeout-minutes: 10
        run: |
          node --test tests/test_release_envelope_size.cjs
          node scripts/check-release-envelope-size.cjs

      - name: Upload failed release envelope size diagnostics
        if: failure() && hashFiles('build/reports/release-envelope-size.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-envelope-size-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: build/reports/release-envelope-size.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload failed classic size diagnostics
        if: failure() && hashFiles('build/reports/classic-size-diagnostics.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: classic-size-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: build/reports/classic-size-diagnostics.json
          if-no-files-found: error
          retention-days: 14

      - name: Check classic bundle size budgets
        run: npm run check:size

      - name: Measure emitted classic module composition
        run: npm run measure:composition

      - name: Upload classic build report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: classic-build-report-${{ github.sha }}
          path: |
            build/reports/classic-bundle.json
            build/reports/classic-composition.json
          if-no-files-found: error
          retention-days: 14

      - name: Classic bundle smoke (ES5)
        run: npm run check:bundle

      - name: Check emitted ES5 grammar
        run: npm run check:es5

      # Host output is not a Docker input: generated build/dist directories are
      # ignored, and the Dockerfile copies only its declared source paths.
      - name: Build container frontend from declared inputs
        timeout-minutes: 10
        run: docker build --target build --progress=plain .

      - name: Install browsers for device and native UI checks
        run: |
          sudo env CI="$CI" python3 scripts/ci-apt-mirror.py
          npx playwright install --with-deps chromium webkit

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Verify isolated multiaudio playback and worker replacement
        timeout-minutes: 20
        run: |
          sudo apt-get install -y ffmpeg
          cargo build --locked -p ottplay-server
          OTT_TEST_FFMPEG="$(command -v ffmpeg)"
          OTT_TEST_FFPROBE="$(command -v ffprobe)"
          export OTT_TEST_FFMPEG OTT_TEST_FFPROBE
          export OTT_TEST_SERVER="$PWD/target/debug/ottplay-server"
          export OTT_TEST_DIRECT_HTTPS=1
          export OTT_TEST_ENGINE=hls
          export OTT_TEST_CRASH=1
          export OTT_TEST_FAIL_START_ONCE=1
          export OTT_TEST_CAPTURE_WORKER=1
          export OTT_TEST_OBSERVE_SECONDS=20
          node tests/test_normalization_webkit.cjs

      - name: Test local browser media and offline app shell
        # The runner terminates this isolated browser test process group if an
        # unexpected browser promise stops settling; normal runs take <2 min.
        timeout-minutes: 10
        run: |
          node tests/test_browser_direct_media.cjs
          node tests/test_browser_local_media.cjs --built-ui
          node tests/test_browser_local_media.cjs --built-ui --initial-retry

      - name: Test hosted EPG worker and persistent cache
        run: npm run test:hosted:browser

      - name: Test device boot and remote navigation in Chromium
        id: device-browser
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: build/global-favorites-browser-ci/playwright.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: build/device-browser-report
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          mkdir -p build/global-favorites-browser-ci
          rm -f build/global-favorites-browser-ci/playwright.json build/global-favorites-browser-ci/verdict.json
          npm run test:devices:browser -- --reporter=list,html,json

      - name: Verify mixed Favorites browser evidence
        if: always()
        timeout-minutes: 1
        env:
          BROWSER_STEP_OUTCOME: ${{ steps.device-browser.outcome }}
        run: >-
          python3 scripts/verify-global-favorites-browser.py
          --report build/global-favorites-browser-ci/playwright.json
          --output build/global-favorites-browser-ci/verdict.json
          --browser-outcome "$BROWSER_STEP_OUTCOME"

      # Later WebKit tests reuse the report/results directories. Preserve this
      # Chromium run, including a negative verdict, before those steps run.
      - name: Upload mixed Favorites browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: global-favorites-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/global-favorites-browser-ci/
            build/device-browser-report/
            build/device-browser-results/
          if-no-files-found: error
          retention-days: 7

      - name: Check out the pinned Home Assistant controller fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-ott-play/ottplay-control-server
          ref: efb67ab9a493465065d291bf51c3814196d676f7
          path: .control-ha-smoke
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Test Home Assistant events with the built player
        timeout-minutes: 5
        run: node .control-ha-smoke/scripts/smoke_home_assistant.cjs .

      # Linux WebKit exercises MSE here; native HLS needs the macOS media stack.
      # The complete engine matrix is required by Native Shells' apple job.
      - name: Test MSE aspect persistence in Linux WebKit
        run: npx playwright test tests/browser/plex-provider.spec.cjs --grep 'Plex aspect persists.*(hls\.js|video\.js)$' --browser=webkit

      - name: Test native channel formatting with enforced CSP
        run: npm run test:native:ui

      - name: Upload device browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-browser-failures-${{ github.sha }}
          path: |
            build/device-browser-report/
            build/device-browser-results/
            build/native-ui-report/
            build/native-ui-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Package base OTT for device testing
        run: npm run package:modea

      - name: Validate bundled Tizen TV startup
        id: tizen-browser
        timeout-minutes: 3
        run: |
          npm run package:tizen -- --local
          npm run verify:tizen -- --local
          npm run test:tizen:browser -- --package-dir build/packages --output build/tizen-browser

      - name: Upload Tizen package browser evidence
        if: always() && steps.tizen-browser.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tizen-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: build/tizen-browser/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload base OTT test bundle
        id: browser-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ottplay-foss-modea-${{ github.sha }}
          path: |
            build/packages/ottplay-foss-modea.tar.gz
            build/packages/ottplay-foss-modea.sha256
          retention-days: 14

    # Device navigation and the final CSP suite share this total job budget.
    timeout-minutes: 40
  frontend-tests:
    name: Frontend Tests
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:test-inventory
      - run: npm test
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r requirements-test.txt
      - name: Python suite and runtime branch coverage gate
        run: npm run test:python
      - name: Preserve Python suite evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-suite-evidence
          path: reports/python/
          retention-days: 14

    timeout-minutes: 40
  rust-tests:
    name: Rust Core and Server Tests
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Verify published GLib source and security backport
        run: node scripts/check-glib-backport.cjs
      - name: Verify native drag pasteboard dependency guards
        run: node scripts/check-macos-drag-backport.cjs
      - name: Verify updater source
        run: python3 scripts/check-updater-backport.py
      - name: Verify bounded torrent metadata source
        run: node scripts/check-librqbit-backport.cjs
      - name: Check fuzz formatting
        run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Test isolated container workspace and lockfile inputs
        run: python3 tests/test_container_workspace.py
      - name: Test core and server including shared XMLTV differential contracts
        run: cargo test --locked -p ottplay-core -p ottplay-server -p ottplay-companion
      - name: Verify bounded torrent metadata acquisition
        run: |
          cargo test --locked --manifest-path tests/librqbit-resource-regression/Cargo.toml --no-default-features --features rust-tls --lib resource_bounds_tests
      - name: Install media tools for isolated normalization checks
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo env CI="$CI" python3 scripts/ci-apt-mirror.py
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Verify real multiaudio normalization and private overlays
        run: |
          OTT_TEST_FFMPEG="$(command -v ffmpeg)"
          OTT_TEST_FFPROBE="$(command -v ffprobe)"
          export OTT_TEST_FFMPEG OTT_TEST_FFPROBE
          cargo test --locked -p ottplay-core audio_normalization --lib -- --include-ignored
          cargo test --locked -p ottplay-server normalization --bin ottplay-server -- --include-ignored
          python3 tests/test_normalize_m3u_overlay.py
      - name: Verify local AVI and MKV HTTP playback with generated media
        run: bash scripts/test-local-container-compatibility.sh
      - name: Verify private Linux playback selection guards
        run: cargo test --locked --manifest-path tests/linux-media-compat/Cargo.toml
      - name: Test Linux playback packaging contracts
        run: |
          python3 packaging/linux-playback-compat/test_builder.py
          python3 tests/test_linux_playback_packaging.py
      - name: Replay fixed fuzz regression corpus (no fuzz campaign)
        run: |
          cargo clippy --locked --manifest-path fuzz/Cargo.toml --lib -- -D warnings
          cargo test --locked --manifest-path fuzz/Cargo.toml --lib
      - name: Enforce release server EPG performance budgets
        run: |
          cargo build --locked --release -p ottplay-server
          python3 scripts/check-epg-performance.py --server target/release/ottplay-server --output reports/epg/performance.json
      - name: Verify companion listener isolation
        env:
          OTTPLAY_SERVER_BIN: target/release/ottplay-server
        run: python3 tests/native_companion/listener_smoke.py
      - name: Preserve EPG performance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: epg-performance
          path: reports/epg/performance.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify updater source and ZIP compatibility
        run: |
          cargo test --locked --manifest-path tests/updater-zip-regression/Cargo.toml
      - name: Install GLib for optimized iterator regression
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev pkg-config
      - name: Exercise patched GLib iterator through FFI in release mode
        run: cargo test --locked --release --manifest-path tests/glib-variant-regression/Cargo.toml
    timeout-minutes: 30

  browser-compatibility:
    needs: build
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/typescript-ci.yml@6b2d99519d513d2b871d2a845ddd6134dea4af2c
    permissions:
      contents: read
      actions: read
    with:
      node-version: "22"
      run-node-ci: false
      browser-matrix-file: .github/browser-compatibility.json
      browser-test-command: node scripts/browser-acceptance.cjs
      browser-artifact-id: ${{ needs.build.outputs.browser-artifact-id }}
      browser-artifact-path: browser-candidate
      browser-prepare-command: |
        if [ "${RUNNER_OS:-}" = "Linux" ] && [ "${RUNNER_ENVIRONMENT:-}" = "github-hosted" ]; then
          sudo env CI="$CI" python3 scripts/ci-apt-mirror.py
        fi
        # Synthetic HLS media requires the locked mux.js dev dependency.
        npm ci --include=dev --ignore-scripts
        PYTHON=python3
        if ! "$PYTHON" -c 'import sys; assert sys.version_info >= (3, 8)' 2>/dev/null; then PYTHON=python; fi
        "$PYTHON" scripts/prepare_browser_candidate.py browser-candidate browser-candidate-web
